<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClubManager - Gestion de clubs sportifs moderne et efficace" />
    <meta name="theme-color" content="#667eea" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Title -->
    <title>ClubManager - Gestion de clubs sportifs</title>

    <!-- Preconnect to API domain for performance -->
    <link rel="preconnect" href="https://clubmanagment.com" />

    <!-- Security headers meta tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClubManager" />
    <meta property="og:description" content="Gestion de clubs sportifs moderne et efficace" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClubManager" />
    <meta name="twitter:description" content="Gestion de clubs sportifs moderne et efficace" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <!-- Root element for React app -->
    <div id="root"></div>

    <!-- No JavaScript fallback -->
    <noscript>
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        <h1 style="font-size: 2rem; color: #667eea; margin-bottom: 1rem;">
          JavaScript requis
        </h1>
        <p style="font-size: 1.1rem; color: #4b5563; max-width: 600px;">
          ClubManager nécessite JavaScript pour fonctionner.
          Veuillez activer JavaScript dans votre navigateur pour continuer.
        </p>
      </div>
    </noscript>

    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
