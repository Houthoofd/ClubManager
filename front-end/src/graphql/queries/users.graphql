# ============================================================================
# User Subscriptions (User's active subscription)
# ============================================================================

query GetUserSubscription($userId: Int!) {
  userSubscription(userId: $userId) {
    id
    user_id
    subscription_id
    start_date
    end_date
    active
    created_at
    updated_at
    subscription {
      id
      subscription_name
      price
      duration_months
    }
  }
}
