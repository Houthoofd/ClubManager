# ============================================================================
# Users Queries - English Schema
# ============================================================================

query GetUsers($take: Int, $skip: Int) {
  users(take: $take, skip: $skip) {
    id
    first_name
    last_name
    email
    phone
    birth_date
    address
    gender_id
    role
    active
    email_verified
    created_at
    updated_at
  }
}

query GetUser($id: Int!) {
  user(id: $id) {
    id
    first_name
    last_name
    email
    phone
    birth_date
    address
    gender_id
    role
    active
    email_verified
    created_at
    updated_at
  }
}

query GetMe {
  me {
    id
    first_name
    last_name
    email
    phone
    birth_date
    address
    gender_id
    role
    active
    email_verified
    created_at
    updated_at
  }
}

# ============================================================================
# Users Mutations
# ============================================================================

mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    first_name
    last_name
    email
    phone
    role
    active
    created_at
  }
}

mutation UpdateUser($id: Int!, $input: UpdateUserInput!) {
  updateUser(id: $id, input: $input) {
    id
    first_name
    last_name
    email
    phone
    birth_date
    address
    active
    updated_at
  }
}

mutation DeleteUser($id: Int!) {
  deleteUser(id: $id) {
    success
    message
  }
}

