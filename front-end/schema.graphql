scalar Upload

# ============================================================================
# Response Types
# ============================================================================

type AuthResult {
  success: Boolean!
  message: String!
  token: String
  user: Users
}

type MutationResult {
  success: Boolean!
  message: String!
}

type PaymentResult {
  success: Boolean!
  message: String!
  payment: Payments
  clientSecret: String
}

type EmailCheckResult {
  exists: Boolean!
  email: String!
}

type PasswordResetTokenValidation {
  valid: Boolean!
  userId: Int
  expiresAt: String
}

# ============================================================================
# Verification Types
# ============================================================================

type ProductCheckResult {
  exists: Boolean!
  product: Products
}

type CourseCheckResult {
  exists: Boolean!
  conflictingCourses: [RecurringCourses!]
}

input CheckCourseScheduleInput {
  day: String!
  startTime: String!
  endTime: String!
  courseType: String
  excludeOriginal: Boolean
  originalDay: String
  originalType: String
  originalStartTime: String
  originalEndTime: String
}

type RecurringCourses {
  id: Int!
  day: String!
  start_time: String!
  end_time: String!
  course_type: String!
  instructor_id: Int
}

# ============================================================================
# Payment Intent Types
# ============================================================================

type PaymentIntentResult {
  success: Boolean!
  message: String!
  clientSecret: String
  paymentIntentId: String
  amount: Float
}

type OrderPaymentConfirmResult {
  success: Boolean!
  message: String!
  payment: Payments
  order: Orders
}

input CreatePaymentIntentForOrderInput {
  orderId: Int!
  userId: Int!
  amount: Float!
  currency: String
  metadata: JSON
}

input ConfirmOrderPaymentInput {
  orderId: Int!
  userId: Int!
  paymentIntentId: String!
  paymentMethod: String!
}
