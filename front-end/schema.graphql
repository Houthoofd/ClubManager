  password: String!
  first_name: String!
  last_name: String!
  phone: String
  birth_date: String
  gender_id: Int
}

input CreateUserInput {
  email: String!
  password: String!
  first_name: String!
  last_name: String!
  phone: String
  birth_date: String
  address: String
  gender_id: Int
  role: String
}

input UpdateUserInput {
  email: String
  first_name: String
  last_name: String
  phone: String
  birth_date: String
  address: String
  gender_id: Int
  active: Boolean
}

input CreateSessionInput {
  session_type_id: Int!
  instructor_id: Int!
  date: String!
  start_time: String!
  end_time: String!
  location: String
  max_participants: Int
  notes: String
}

input UpdateSessionInput {
  session_type_id: Int
  instructor_id: Int
  date: String
  start_time: String
  end_time: String
  location: String
  max_participants: Int
  status: String
  notes: String
}

input CreateInstructorInput {
  user_id: Int!
  specialization: String
  bio: String
  certifications: String
  active: Boolean
}

input UpdateInstructorInput {
  user_id: Int
  specialization: String
  bio: String
  certifications: String
  active: Boolean
}

input CreateProductInput {
  name: String!
  description: String
  price: Float!
  category_id: Int!
  image_url: String
  active: Boolean
}

input UpdateProductInput {
  name: String
  description: String
  price: Float
  category_id: Int
  image_url: String
  active: Boolean
}

input CreateOrderInput {
  user_id: Int!
