name: 🚀 CD - Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger sur tags version (ex: v1.0.0, v1.2.3)
  workflow_dispatch:  # Permet déclenchement manuel

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # JOB 1: BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  build-and-push:
    name: 📦 Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Extract version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Version: ${VERSION}"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # BUILD API IMAGE
      # ========================================================================
      - name: 🏷️ Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # ========================================================================
      # BUILD FRONTEND IMAGE
      # ========================================================================
      - name: 🏷️ Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: ✅ Images pushed successfully
        run: |
          echo "✅ API Image: ${{ steps.meta-api.outputs.tags }}"
          echo "✅ Frontend Image: ${{ steps.meta-frontend.outputs.tags }}"

  # ============================================================================
  # JOB 2: DEPLOY API TO EC2
  # ============================================================================
  deploy-api:
    name: 🚀 Deploy API to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-api
      url: ${{ secrets.API_URL }}

    steps:
      - name: 📥 Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: false

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_API_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy API to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_API_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME_API }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << 'EOF'
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new image
            docker pull ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

            # Stop and remove old container
            docker stop clubmanager-api || true
            docker rm clubmanager-api || true

            # Run new container
            docker run -d \
              --name clubmanager-api \
              --restart unless-stopped \
              -p 4000:4000 \
              -e NODE_ENV=production \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }} \
              -e REDIS_URL=${{ secrets.REDIS_URL }} \
              -e SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
              ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

            # Health check
            sleep 10
            curl -f http://localhost:4000/health || exit 1

            # Cleanup old images
            docker image prune -f
          EOF

      - name: ✅ API deployed successfully
        run: echo "✅ API v${{ needs.build-and-push.outputs.version }} deployed to EC2"

  # ============================================================================
  # JOB 3: DEPLOY FRONTEND TO S3
  # ============================================================================
  deploy-frontend:
    name: 🌐 Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-frontend
      url: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./front-end
        run: npm ci

      - name: 🔨 Build frontend
        working-directory: ./front-end
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          NODE_ENV: production
        run: npm run build

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📤 Sync to S3
        working-directory: ./front-end
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "assets/manifest.json"

          # Upload index.html without cache (pour updates immédiates)
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: ♻️ Invalidate CloudFront cache
        if: secrets.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: ✅ Frontend deployed successfully
        run: |
          echo "✅ Frontend v${{ needs.build-and-push.outputs.version }} deployed to S3"
          echo "🌐 URL: ${{ secrets.FRONTEND_URL }}"

  # ============================================================================
  # JOB 4: RUN DATABASE MIGRATIONS
  # ============================================================================
  run-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-api]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: 📚 Install dependencies
        working-directory: ./api
        run: npm ci

      - name: 🔄 Run Prisma migrations
        working-directory: ./api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          echo "✅ Migrations applied successfully"

  # ============================================================================
  # JOB 5: SMOKE TESTS
  # ============================================================================
  smoke-tests:
    name: 🧪 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-frontend, run-migrations]

    steps:
      - name: 🏥 Health check API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.API_URL }}/health)
          if [ $response -eq 200 ]; then
            echo "✅ API health check passed"
          else
            echo "❌ API health check failed (HTTP $response)"
            exit 1
          fi

      - name: 🧪 Test GraphQL endpoint
        run: |
          response=$(curl -s -X POST ${{ secrets.API_URL }}/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}' \
            -w "%{http_code}" -o /dev/null)

          if [ $response -eq 200 ]; then
            echo "✅ GraphQL endpoint test passed"
          else
            echo "❌ GraphQL test failed (HTTP $response)"
            exit 1
          fi

      - name: 🌐 Test Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }})
          if [ $response -eq 200 ]; then
            echo "✅ Frontend test passed"
          else
            echo "❌ Frontend test failed (HTTP $response)"
            exit 1
          fi

      - name: ✅ All smoke tests passed
        run: echo "🎉 Deployment successful and verified!"

  # ============================================================================
  # JOB 6: CREATE GITHUB RELEASE
  # ============================================================================
  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-tests]
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎉 Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ needs.build-and-push.outputs.version }}
          body: |
            ## 🚀 ClubManager ${{ needs.build-and-push.outputs.version }}

            ### 📦 Docker Images

            **API:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ needs.build-and-push.outputs.version }}
            ```

            **Frontend:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ needs.build-and-push.outputs.version }}
            ```

            ### 🌐 Déployé sur:
            - **Frontend:** ${{ secrets.FRONTEND_URL }}
            - **API:** ${{ secrets.API_URL }}

            ### 📝 Changelog
            ${{ steps.changelog.outputs.changelog }}

            ### ✅ Tests
            - Build: ✅ Passed
            - Smoke tests: ✅ Passed
            - Deployment: ✅ Successful
          draft: false
          prerelease: false

  # ============================================================================
  # JOB 7: NOTIFY SUCCESS
  # ============================================================================
  notify:
    name: 📢 Notify Deployment
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()

    steps:
      - name: 📧 Send notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🎉 Version ${{ needs.build-and-push.outputs.version }} is live!"
          # Ajouter ici Slack/Discord/Email notification si souhaité

      - name: ⚠️ Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "🔍 Check logs for details"
          # Ajouter ici Slack/Discord/Email notification si souhaité
