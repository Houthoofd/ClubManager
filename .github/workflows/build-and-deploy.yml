name: Deploy ClubManager (no build, only deploy)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🧹 Nettoyage de l'ancien contenu du dossier clubmanager..."
            sudo rm -rf /usr/share/nginx/html/clubmanager
            sudo mkdir -p /usr/share/nginx/html/clubmanager

            echo "📁 Vérification du dossier front-end/dist..."
            if [ ! -d "front-end/dist" ]; then
              echo "❌ ERREUR : le dossier front-end/dist n'existe pas !"
              exit 1
            fi

            echo "📁 Copie des fichiers front-end compilés..."
            sudo cp -r front-end/dist/* /usr/share/nginx/html/clubmanager/

            echo "🔧 Fix permissions sur les fichiers et dossiers..."
            sudo find /usr/share/nginx/html/clubmanager -type d -exec chmod 755 {} \;
            sudo find /usr/share/nginx/html/clubmanager -type f -exec chmod 644 {} \;
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager

            echo "🔁 Rechargement de Nginx et redémarrage du service API..."
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service

            echo "✅ Déploiement terminé avec succès"
