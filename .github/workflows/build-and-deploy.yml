name: Build and Deploy ClubManager (API & Front)

on:
  push:
    branches:
      - hosting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Installer toutes les dépendances à la racine si workspaces (recommandé)
      - name: Install root dependencies
        run: npm install

      # Compiler les types
      - name: Build shared types
        run: |
          cd packages/types
          npm install
          npm run build

      # API
      - name: Install dependencies (API)
        run: |
          cd api
          npm install

      - name: Build API
        run: |
          cd api
          npm run build

      # Front
      - name: Install dependencies (Front)
        run: |
          cd front-end
          npm install

      - name: Build Front
        run: |
          cd front-end
          npm run build

            - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "✅ Connexion SSH réussie"
            cd /home/ec2-user/ClubManager

            # Remise à zéro des droits avant mise à jour
            echo "🔧 Ajustement des droits sur le dossier ClubManager..."
            sudo chown -R $USER:$USER /home/ec2-user/ClubManager
            sudo chmod -R u+rwX /home/ec2-user/ClubManager

            git pull origin hosting

            # Build types partagés
            cd packages/types
            npm install
            npm run build

            # Build API et restart
            cd ../../api
            npm install
            npm run build
            sudo systemctl restart clubmanager.service

            # Build front
            cd ../front-end
            npm install
            npm run build

            # Ajustement des droits pour nginx
            echo "🔧 Ajustement des droits pour nginx sur /var/www/html..."
            sudo chown -R nginx:nginx /var/www/html

            # Copier les fichiers front dans nginx
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

