name: Deploy ClubManager (sync complete dist)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🔍 Vérification du contenu complet de dist..."
            if [ -f "front-end/dist/index.html" ]; then
              echo "✅ index.html trouvé"
              
              if [ -d "front-end/dist/assets" ]; then
                JS_COUNT=$(find front-end/dist/assets/ -name "*.js" 2>/dev/null | wc -l)
                CSS_COUNT=$(find front-end/dist/assets/ -name "*.css" 2>/dev/null | wc -l)
                
                echo "📦 Assets trouvés: JS=$JS_COUNT, CSS=$CSS_COUNT"
                echo "📦 Contenu de front-end/dist/:"
                ls -la front-end/dist/
                echo "📦 Contenu de front-end/dist/assets/:"
                ls -la front-end/dist/assets/
                
                if [ "$JS_COUNT" -gt 0 ] && [ "$CSS_COUNT" -gt 0 ]; then
                  echo "✅ Build complet disponible dans le repo"
                  USE_REPO_BUILD=true
                else
                  echo "❌ Assets JS/CSS manquants, build nécessaire"
                  USE_REPO_BUILD=false
                fi
              else
                echo "❌ Dossier assets manquant"
                USE_REPO_BUILD=false
              fi
            else
              echo "❌ index.html manquant"
              USE_REPO_BUILD=false
            fi

            # Build ou utilisation du repo selon disponibilité
            if [ "$USE_REPO_BUILD" = "true" ]; then
              echo "📦 Utilisation du build du repo (front-end/dist/)"
              SOURCE_DIR="front-end/dist"
            else
              echo "🏗️ Génération d'un nouveau build..."
              cd front-end
              
              # Installation des dépendances si nécessaire
              if [ ! -d "node_modules" ]; then
                echo "📥 Installation des dépendances npm..."
                npm install
              fi
              
              # Build
              echo "🔨 Lancement du build..."
              npm run build
              
              # Vérification du build généré
              if [ -f "dist/index.html" ] && [ -d "dist/assets" ]; then
                echo "✅ Build généré avec succès"
                echo "📦 Contenu du build généré:"
                ls -la dist/
                ls -la dist/assets/
                SOURCE_DIR="../front-end/dist"
                cd ..
              else
                echo "❌ Échec du build"
                exit 1
              fi
            fi

            echo "🧹 Suppression complète de l'ancien contenu nginx..."
            sudo rm -rf /usr/share/nginx/html/clubmanager/*
            sudo mkdir -p /usr/share/nginx/html/clubmanager

            echo "📋 Copie COMPLÈTE du contenu dist (index.html + assets + tout)..."
            
            # Copier TOUT le contenu du dossier dist
            sudo cp -r ${SOURCE_DIR}/* /usr/share/nginx/html/clubmanager/
            
            # Vérifier que tout est copié
            echo "🔍 Vérification de la copie complète:"
            echo "📄 index.html:"
            sudo ls -la /usr/share/nginx/html/clubmanager/index.html
            echo "📁 assets/:"
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/
            echo "🎯 Fichiers JS:"
            sudo find /usr/share/nginx/html/clubmanager/assets/ -name "*.js"
            echo "🎨 Fichiers CSS:"
            sudo find /usr/share/nginx/html/clubmanager/assets/ -name "*.css"

            # Vérifier les liens dans index.html
            echo "🔗 Vérification des liens dans index.html:"
            sudo head -n 20 /usr/share/nginx/html/clubmanager/index.html | grep -E "(\.js|\.css)"

            echo "🔐 Application des permissions nginx..."
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo chmod -R 644 /usr/share/nginx/html/clubmanager
            sudo find /usr/share/nginx/html/clubmanager -type d -exec chmod 755 {} \;

            echo "♻️ Rechargement nginx..."
            sudo systemctl reload nginx
            
            echo "🔄 Redémarrage du service clubmanager..."
            sudo systemctl restart clubmanager.service || echo "⚠️ Service clubmanager non trouvé (normal si pas configuré)"

            echo "✅ Déploiement complet terminé!"
            echo "📊 Résumé:"
            echo "  - index.html synchronisé"
            echo "  - Assets JS/CSS synchronisés"
            echo "  - Liens cohérents garantis"
            echo "  - Permissions nginx appliquées"