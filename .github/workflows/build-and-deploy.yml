name: Deploy ClubManager (rebuild frontend)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🏗️ REBUILD obligatoire du frontend pour synchroniser Vite..."
            cd front-end
            
            # S'assurer que node_modules est à jour
            echo "📦 Installation/mise à jour des dépendances..."
            npm ci
            
            # Nettoyer le build précédent
            echo "🧹 Nettoyage du build précédent..."
            rm -rf dist/
            
            # Build avec Vite (cela génère un nouvel index.html cohérent)
            echo "⚡ Build Vite (génère index.html + assets cohérents)..."
            npm run build
            
            # Vérifier que le build s'est bien passé
            if [ ! -f "dist/index.html" ]; then
              echo "❌ Build échoué - index.html manquant"
              exit 1
            fi
            
            if [ ! -d "dist/assets" ]; then
              echo "❌ Build échoué - dossier assets manquant"
              exit 1
            fi
            
            # Afficher le contenu du nouveau build
            echo "✅ Build réussi ! Contenu généré :"
            echo "📄 index.html:"
            cat dist/index.html
            echo ""
            echo "📦 Assets générés:"
            ls -la dist/assets/
            
            # Vérifier la cohérence entre index.html et les fichiers
            echo "🔍 Vérification cohérence index.html ↔ assets..."
            JS_IN_HTML=$(grep -o 'assets/[^"]*\.js' dist/index.html | head -n1)
            CSS_IN_HTML=$(grep -o 'assets/[^"]*\.css' dist/index.html | head -n1)
            
            echo "🔗 Liens détectés dans index.html:"
            echo "  JS: $JS_IN_HTML"
            echo "  CSS: $CSS_IN_HTML"
            
            # Vérifier que les fichiers existent
            if [ -f "dist/$JS_IN_HTML" ]; then
              echo "✅ Fichier JS correspondant trouvé"
            else
              echo "❌ Fichier JS manquant: $JS_IN_HTML"
              exit 1
            fi
            
            if [ -f "dist/$CSS_IN_HTML" ]; then
              echo "✅ Fichier CSS correspondant trouvé"
            else
              echo "❌ Fichier CSS manquant: $CSS_IN_HTML"
              exit 1
            fi
            
            cd ..

            echo "🧹 Suppression COMPLÈTE de l'ancien contenu nginx..."
            sudo chmod -R 777 /usr/share/nginx/html/clubmanager 2>/dev/null || echo "Dossier n'existe pas"
            sudo chattr -R -i /usr/share/nginx/html/clubmanager 2>/dev/null || echo "Pas d'attributs immutables"
            sudo rm -rf /usr/share/nginx/html/clubmanager
            sudo mkdir -p /usr/share/nginx/html/clubmanager

            echo "📋 Copie du nouveau build cohérent..."
            sudo cp -r front-end/dist/* /usr/share/nginx/html/clubmanager/
            
            echo "🔐 Application des permissions nginx..."
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo find /usr/share/nginx/html/clubmanager -type d -exec chmod 755 {} \;
            sudo find /usr/share/nginx/html/clubmanager -type f -exec chmod 644 {} \;

            echo "🔍 Vérification finale après déploiement..."
            echo "📄 index.html déployé:"
            sudo head -10 /usr/share/nginx/html/clubmanager/index.html
            
            echo "📁 Assets déployés:"
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/
            
            # Test final de cohérence
            DEPLOYED_JS=$(sudo grep -o 'assets/[^"]*\.js' /usr/share/nginx/html/clubmanager/index.html | head -n1)
            DEPLOYED_CSS=$(sudo grep -o 'assets/[^"]*\.css' /usr/share/nginx/html/clubmanager/index.html | head -n1)
            
            echo "🔗 Liens dans l'index.html déployé:"
            echo "  JS: $DEPLOYED_JS"
            echo "  CSS: $DEPLOYED_CSS"
            
            if sudo test -f "/usr/share/nginx/html/clubmanager/$DEPLOYED_JS"; then
              echo "✅ Fichier JS déployé: EXISTE"
            else
              echo "❌ Fichier JS déployé: MANQUANT"
              exit 1
            fi
            
            if sudo test -f "/usr/share/nginx/html/clubmanager/$DEPLOYED_CSS"; then
              echo "✅ Fichier CSS déployé: EXISTE"
            else
              echo "❌ Fichier CSS déployé: MANQUANT"
              exit 1
            fi

            echo "♻️ Rechargement nginx..."
            sudo systemctl reload nginx

            echo "🎉 DÉPLOIEMENT AVEC REBUILD TERMINÉ AVEC SUCCÈS!"
            echo ""
            echo "📊 Résumé:"
            echo "  ✅ Frontend rebuilder avec Vite"
            echo "  ✅ index.html + assets générés de façon cohérente"
            echo "  ✅ Fichiers synchronisés et déployés"
            echo "  ✅ Permissions nginx appliquées"
            echo ""
            echo "🌐 Site disponible sur https://clubmanagment.com"
            echo "🔧 Les liens JS/CSS sont maintenant cohérents grâce au rebuild"