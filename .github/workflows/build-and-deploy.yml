name: Deploy ClubManager (no build, only deploy)

on:
  push:
    branches:
      - hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin hosting

            echo "🧹 Nettoyage de l'ancien contenu..."
            sudo rm -rf /usr/share/nginx/html/*

            echo "📁 Copie du build front-end dans /usr/share/nginx/html..."
            sudo cp -r front-end/dist/* /usr/share/nginx/html/
            sudo chown -R $USER:$USER /usr/share/nginx/html
            sudo chmod -R 755 /usr/share/nginx/html

            echo "🔁 Redémarrage de nginx et du service clubmanager..."
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service

            echo "✅ Déploiement terminé avec succès"
