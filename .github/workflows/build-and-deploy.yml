name: Deploy ClubManager (no build, only deploy)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔍 Vérification de la branche actuelle..."
            git branch
            
            echo "🔄 Basculement vers la branche back-up/hosting..."
            git checkout back-up/hosting || git checkout -b back-up/hosting origin/back-up/hosting

            echo "🔄 Pull depuis la branche back-up/hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "📊 Vérification de la version..."
            echo "Branche actuelle: $(git branch --show-current)"
            echo "Dernier commit: $(git rev-parse --short HEAD)"
            echo "Dernière modification: $(git log -1 --format='%ci')"

            echo "🧹 Nettoyage de l'ancien contenu du dossier clubmanager..."
            sudo rm -rf /usr/share/nginx/html/clubmanager

            echo "📁 Création du dossier clubmanager et copie des fichiers..."
            sudo mkdir -p /usr/share/nginx/html/clubmanager
            sudo cp -r front-end/dist/* /usr/share/nginx/html/clubmanager/
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo chmod -R 755 /usr/share/nginx/html/clubmanager

            echo "🔁 Rechargement de nginx et redémarrage du service clubmanager..."
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service

            echo "✅ Déploiement terminé avec succès"
            echo "🎯 Vérification finale..."
            ls -la | grep test-deploy || echo "Fichier test-deploy.txt non trouvé"
