name: Build and Deploy ClubManager (API & Front)

on:
  push:
    branches:
      - hosting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Installer les dépendances à la racine
      - name: Install root dependencies
        run: npm install

      # Compiler les types
      - name: Build shared types
        run: |
          cd packages/types
          npm install
          npm run build

      # API
      - name: Install dependencies (API)
        run: |
          cd api
          npm install

      - name: Build API
        run: |
          cd api
          npm run build

      # Front
      - name: Install dependencies (Front)
        run: |
          cd front-end
          npm install

      - name: Build Front
        run: |
          cd front-end
          npm run build

      # Déploiement EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔧 Ajustement des droits sur le dossier ClubManager..."
            sudo chown -R $USER:$USER /home/***/ClubManager
            sudo chmod -R u+rwX /home/***/ClubManager

            echo "📌 Nettoyage Git local avant pull"
            git reset --hard HEAD
            git clean -fd
            git pull origin hosting

            echo "📦 Build shared types"
            cd packages/types
            npm install
            if npm run | grep -q build; then npm run build; else echo "No build script in packages/types"; fi

            echo "📦 Build API"
            cd ../../api
            npm install
            npm run build

            echo "📦 Build Front"
            cd ../front-end
            npm install

            # Supprimer dist avant build pour éviter les conflits
            rm -rf dist

            echo "VITE_API_BASE_URL=https://clubmanagment.com" > .env
            npm run build

            echo "🚀 Déploiement frontend vers /var/www/html"
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            # Donner les droits à l'utilisateur nginx (ou www-data selon ta config)
            sudo chown -R nginx:nginx /var/www/html
            sudo chmod -R 755 /var/www/html

            echo "📂 Contenu de /var/www/html après déploiement :"
            ls -l /var/www/html

            echo "🔄 Reload Nginx"
            sudo systemctl reload nginx

            echo "🔄 Restart ClubManager API service"
            sudo systemctl restart clubmanager.service
