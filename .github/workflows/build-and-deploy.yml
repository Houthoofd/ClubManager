name: Deploy ClubManager (fix index.html links)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🔍 Vérification du dossier dist/ dans le repo..."
            if [ -d "front-end/dist" ]; then
              # AJOUTÉ: Analyser les liens dans index.html
              echo "🔍 Analyse des liens dans index.html actuel:"
              if [ -f "front-end/dist/index.html" ]; then
                echo "📄 Liens JS/CSS détectés dans index.html:"
                grep -E "(\.js|\.css)" front-end/dist/index.html || echo "Aucun lien trouvé"
              fi
              
              echo "📦 Fichiers réellement présents dans assets/:"
              ls -la front-end/dist/assets/ 2>/dev/null || echo "❌ Pas de dossier assets/"
              
              # Identifier les vrais fichiers JS et CSS
              if [ -d "front-end/dist/assets" ]; then
                REAL_JS_FILES=$(find front-end/dist/assets/ -name "*.js" 2>/dev/null)
                REAL_CSS_FILES=$(find front-end/dist/assets/ -name "*.css" 2>/dev/null)
                
                echo "🎯 Fichiers JS réels:"
                echo "$REAL_JS_FILES"
                echo "🎨 Fichiers CSS réels:"
                echo "$REAL_CSS_FILES"
                
                # NOUVEAU: Corriger l'index.html si nécessaire
                if [ -f "front-end/dist/index.html" ] && [ -n "$REAL_JS_FILES" ] && [ -n "$REAL_CSS_FILES" ]; then
                  echo "🔧 Correction des liens dans index.html..."
                  
                  # Identifier le nom du vrai fichier JS et CSS
                  REAL_JS_FILE=$(basename $(echo "$REAL_JS_FILES" | head -n1))
                  REAL_CSS_FILE=$(basename $(echo "$REAL_CSS_FILES" | head -n1))
                  
                  echo "🎯 Fichiers cibles: JS=$REAL_JS_FILE, CSS=$REAL_CSS_FILE"
                  
                  # Créer une copie de sauvegarde
                  cp front-end/dist/index.html front-end/dist/index.html.backup
                  
                  # AJOUTÉ: Script de correction des liens
                  cat > fix_index_links.sh << 'EOF'
            #!/bin/bash
            INDEX_FILE="$1"
            JS_FILE="$2"
            CSS_FILE="$3"
            
            echo "🔧 Correction de $INDEX_FILE avec JS=$JS_FILE et CSS=$CSS_FILE"
            
            # Remplacer tous les liens JS par le bon fichier
            sed -i "s|assets/[^\"']*\.js|assets/$JS_FILE|g" "$INDEX_FILE"
            
            # Remplacer tous les liens CSS par le bon fichier  
            sed -i "s|assets/[^\"']*\.css|assets/$CSS_FILE|g" "$INDEX_FILE"
            
            echo "✅ Liens corrigés dans $INDEX_FILE"
            EOF
                  
                  chmod +x fix_index_links.sh
                  ./fix_index_links.sh "front-end/dist/index.html" "$REAL_JS_FILE" "$REAL_CSS_FILE"
                  
                  echo "🔍 Vérification des liens corrigés:"
                  grep -E "(\.js|\.css)" front-end/dist/index.html
                  
                  USE_PREBUILT=true
                else
                  echo "❌ Impossible de corriger index.html - fichiers manquants"
                  USE_PREBUILT=false
                fi
              else
                echo "❌ Dossier assets manquant"
                USE_PREBUILT=false
              fi
            else
              echo "❌ Pas de dossier dist/ dans le repo"
              USE_PREBUILT=false
            fi

            if [ "$USE_PREBUILT" = "true" ]; then
              echo "📁 Utilisation du dist/ corrigé du repo..."
              BUILD_SOURCE="front-end/dist"
            else
              echo "🏗️ Build du frontend nécessaire..."
              cd front-end
              
              # Installer les dépendances si nécessaire
              if [ ! -d "node_modules" ]; then
                echo "📥 Installation des dépendances npm..."
                npm install
              fi
              
              # Build
              echo "🔨 Lancement du build..."
              npm run build
              
              echo "📦 Vérification du build généré:"
              ls -la dist/
              ls -la dist/assets/
              BUILD_SOURCE="dist"
              cd ..
            fi

            echo "🧹 Nettoyage complet du dossier nginx..."
            sudo rm -rf /usr/share/nginx/html/clubmanager/*
            sudo mkdir -p /usr/share/nginx/html/clubmanager

            echo "📋 Copie COMPLÈTE du contenu corrigé..."
            sudo cp -r ${BUILD_SOURCE}/* /usr/share/nginx/html/clubmanager/
            
            # AJOUTÉ: Vérification post-copie
            echo "🔍 Vérification finale après copie:"
            echo "📄 index.html:"
            sudo ls -la /usr/share/nginx/html/clubmanager/index.html
            echo "📁 assets/:"
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/
            echo "🔗 Liens dans l'index.html copié:"
            sudo grep -E "(\.js|\.css)" /usr/share/nginx/html/clubmanager/index.html || echo "Aucun lien trouvé"
            
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo chmod -R 755 /usr/share/nginx/html/clubmanager
            
            echo "🔁 Rechargement nginx..."
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service || echo "⚠️ Service clubmanager non trouvé"

            echo "✅ Déploiement avec correction des liens terminé!"
            echo "🎯 Résumé:"
            echo "  - index.html corrigé avec les bons liens JS/CSS"  
            echo "  - Tous les fichiers synchronisés"
            echo "  - Permissions nginx appliquées"
            echo "🌐 Votre site devrait maintenant fonctionner sur https://clubmanagment.com"