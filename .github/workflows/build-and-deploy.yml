name: Build and Deploy ClubManager (API & Front)

on:
  push:
    branches:
      - hosting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Installer les dépendances racine si workspaces
      - name: Install root dependencies
        run: npm install

      # Build types partagés
      - name: Build shared types
        run: |
          cd packages/types
          npm install
          npm run build

      # API
      - name: Install dependencies (API)
        run: |
          cd api
          npm install

      - name: Build API
        run: |
          cd api
          npm run build

      # Front
      - name: Install dependencies (Front)
        run: |
          cd front-end
          npm install

      - name: Build Front
        run: |
          cd front-end
          npm run build

      # Déploiement EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔧 Ajustement des droits sur le dossier ClubManager..."
            sudo chown -R $USER:$USER /home/***/ClubManager
            sudo chmod -R u+rwX /home/***/ClubManager

            echo "🔄 Reset Git et pull depuis hosting"
            git reset --hard HEAD
            git clean -fd
            git pull origin hosting

            # Build types partagés
            cd packages/types
            npm install
            if npm run | grep -q build; then npm run build; else echo "No build script in packages/types"; fi

            # Build API
            cd ../../api
            npm install
            npm run build

            # Build Front
            cd ../front-end
            npm install
            echo "VITE_API_BASE_URL=https://clubmanagment.com" > .env
            npm run build || { echo "❌ Échec du build frontend"; exit 1; }

            echo "📂 Contenu du dossier front-end :"
            ls -la

            # Vérification de l'existence du dossier dist
            if [ -d "dist" ]; then
              echo "✅ Le dossier dist existe, déploiement en cours..."
              sudo rm -rf /var/www/html/*
              sudo cp -r dist/. /var/www/html/
              sudo chown -R $USER:$USER /var/www/html
              sudo chmod -R 755 /var/www/html
            else
              echo "❌ Le dossier dist est introuvable après le build !"
              exit 1
            fi

            echo "📁 Contenu final de /var/www/html :"
            ls -l /var/www/html

            # Restart des services
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service
