name: Deploy ClubManager (sync index.html content)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🔍 Vérification du contenu de dist..."
            if [ -f "front-end/dist/index.html" ]; then
              echo "✅ index.html trouvé dans front-end/dist/"
              
              # AJOUTÉ: Afficher le contenu de l'index.html du repo
              echo "📄 Contenu de l'index.html dans le repo:"
              cat front-end/dist/index.html
              
              if [ -d "front-end/dist/assets" ]; then
                echo "✅ Dossier assets trouvé"
                echo "📦 Contenu du dossier assets:"
                ls -la front-end/dist/assets/
                
                # AJOUTÉ: Identifier les vrais noms de fichiers
                REAL_JS_FILE=$(ls front-end/dist/assets/*.js 2>/dev/null | head -n1 | xargs basename)
                REAL_CSS_FILE=$(ls front-end/dist/assets/*.css 2>/dev/null | head -n1 | xargs basename)
                
                echo "🎯 Fichiers réels détectés:"
                echo "  - JS: $REAL_JS_FILE"
                echo "  - CSS: $REAL_CSS_FILE"
                
                # AJOUTÉ: Vérifier les liens dans index.html
                echo "🔗 Liens dans l'index.html du repo:"
                grep -E "(\.js|\.css)" front-end/dist/index.html || echo "Aucun lien trouvé"
                
              else
                echo "❌ Dossier assets manquant"
                exit 1
              fi
            else
              echo "❌ index.html manquant dans front-end/dist/"
              exit 1
            fi

            echo "🧹 Nettoyage du dossier nginx..."
            sudo rm -rf /usr/share/nginx/html/clubmanager
            sudo mkdir -p /usr/share/nginx/html/clubmanager
            sudo mkdir -p /usr/share/nginx/html/clubmanager/assets

            echo "📋 Copie COMPLÈTE du contenu dist..."
            
            # MODIFIÉ: Copier TOUT le contenu de dist/ (index.html + assets + fonts + tout)
            sudo cp -r front-end/dist/* /usr/share/nginx/html/clubmanager/
            
            echo "🔍 Vérification de la copie complète:"
            echo "📄 index.html copié:"
            sudo ls -la /usr/share/nginx/html/clubmanager/index.html
            
            echo "📁 Contenu du dossier clubmanager:"
            sudo ls -la /usr/share/nginx/html/clubmanager/
            
            echo "📁 assets/ copié:"
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/
            
            # AJOUTÉ: Vérifier que les liens dans index.html correspondent aux fichiers copiés
            echo "🔗 Liens dans l'index.html COPIÉ:"
            sudo grep -E "(\.js|\.css)" /usr/share/nginx/html/clubmanager/index.html || echo "Aucun lien trouvé"
            
            # AJOUTÉ: Vérifier que les fichiers référencés existent vraiment
            echo "✅ Vérification de l'existence des fichiers liés:"
            
            # Extraire les noms de fichiers depuis index.html et vérifier leur existence
            JS_REFERENCED=$(sudo grep -o 'assets/[^"]*\.js' /usr/share/nginx/html/clubmanager/index.html | head -n1)
            CSS_REFERENCED=$(sudo grep -o 'assets/[^"]*\.css' /usr/share/nginx/html/clubmanager/index.html | head -n1)
            
            echo "📂 Fichiers référencés dans index.html:"
            echo "  - JS référencé: $JS_REFERENCED"
            echo "  - CSS référencé: $CSS_REFERENCED"
            
            if [ -n "$JS_REFERENCED" ]; then
              if sudo test -f "/usr/share/nginx/html/clubmanager/$JS_REFERENCED"; then
                echo "✅ Fichier JS existe: $JS_REFERENCED"
              else
                echo "❌ Fichier JS MANQUANT: $JS_REFERENCED"
              fi
            fi
            
            if [ -n "$CSS_REFERENCED" ]; then
              if sudo test -f "/usr/share/nginx/html/clubmanager/$CSS_REFERENCED"; then
                echo "✅ Fichier CSS existe: $CSS_REFERENCED"
              else
                echo "❌ Fichier CSS MANQUANT: $CSS_REFERENCED"
              fi
            fi

            echo "🔐 Application des permissions nginx..."
            # CORRIGÉ: Application des permissions nginx avec propriétaire
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo chmod -R 755 /usr/share/nginx/html/clubmanager
            
            # AJOUTÉ: Permissions spécifiques pour les fichiers
            sudo find /usr/share/nginx/html/clubmanager -type f -exec chmod 644 {} \;
            
            echo "✅ Permissions appliquées:"
            echo "  - Propriétaire: nginx:nginx"
            echo "  - Dossiers: 755"
            echo "  - Fichiers: 644"

            echo "♻️ Rechargement nginx..."
            sudo systemctl reload nginx
            
            echo "🔄 Redémarrage du service clubmanager..."
            sudo systemctl restart clubmanager.service || echo "⚠️ Service clubmanager non trouvé (normal si pas configuré)"

            echo "✅ Déploiement terminé avec synchronisation complète!"
            echo "📊 Résumé:"
            echo "  ✅ Tout le contenu de dist/ copié vers nginx"
            echo "  ✅ index.html synchronisé avec les bons liens"
            echo "  ✅ Assets JS/CSS synchronisés"
            echo "  ✅ Permissions nginx appliquées (nginx:nginx, 755/644)"
            
            echo "🌐 Votre site devrait maintenant fonctionner sur https://clubmanagment.com"
            
            # AJOUTÉ: Test final de l'existence des fichiers critiques
            echo "🧪 Test final des fichiers critiques:"
            sudo ls -la /usr/share/nginx/html/clubmanager/index.html
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/*.js 2>/dev/null || echo "Aucun fichier JS trouvé"
            sudo ls -la /usr/share/nginx/html/clubmanager/assets/*.css 2>/dev/null || echo "Aucun fichier CSS trouvé"