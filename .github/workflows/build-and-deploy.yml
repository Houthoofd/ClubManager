name: Deploy ClubManager (no build, only deploy)

on:
  push:
    branches:
      - back-up/hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔄 Pull depuis la branche back-up/hosting..."
            git reset --hard HEAD
            git clean -fd
            git pull origin back-up/hosting

            echo "🔧 Installation des dépendances frontend..."
            cd /home/***/ClubManager/front-end
            npm install
            
            echo "🏗️ Build du frontend..."
            npm run build
            
            echo "✅ Vérification que le build frontend a réussi..."
            if [ ! -d "dist" ]; then
              echo "❌ Erreur: Le dossier dist/ n'existe pas après le build"
              exit 1
            fi
            
            if [ ! -f "dist/index.html" ]; then
              echo "❌ Erreur: index.html manquant dans dist/"
              exit 1
            fi
            
            echo "📦 Contenu du dossier dist/:"
            ls -la dist/
            echo "📦 Contenu du dossier dist/assets/:"
            ls -la dist/assets/ || echo "Pas de dossier assets/"

            echo "🧹 Nettoyage de l'ancien contenu du dossier clubmanager..."
            sudo rm -rf /usr/share/nginx/html/clubmanager

            echo "📁 Création du dossier clubmanager et copie des fichiers..."
            sudo mkdir -p /usr/share/nginx/html/clubmanager
            sudo cp -r dist/* /usr/share/nginx/html/clubmanager/
            sudo chown -R nginx:nginx /usr/share/nginx/html/clubmanager
            sudo chmod -R 755 /usr/share/nginx/html/clubmanager

            echo "🔧 Installation des dépendances backend..."
            cd /home/***/ClubManager/api
            npm install
            npm run build

            echo "🔁 Rechargement de nginx et redémarrage du service clubmanager..."
            sudo systemctl reload nginx
            sudo systemctl restart clubmanager.service

            echo "✅ Déploiement terminé avec succès"
            echo "📊 Vérification des logs de déploiement..."
            echo "Version déployée: $(git rev-parse --short HEAD)"
            echo "Dernière modification: $(git log -1 --format='%ci')"
