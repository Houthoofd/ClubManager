name: Build and Deploy ClubManager (API & Front)

on:
  push:
    branches:
      - hosting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Installer toutes les dépendances à la racine si workspaces (recommandé)
      - name: Install root dependencies
        run: npm install

      # Compiler les types
      - name: Build shared types
        run: |
          cd packages/types
          npm install
          npm run build

      # API
      - name: Install dependencies (API)
        run: |
          cd api
          npm install

      - name: Build API
        run: |
          cd api
          npm run build

      # Front
      - name: Install dependencies (Front)
        run: |
          cd front-end
          npm install

      - name: Inject env variables for Vite
        run: |
          cd front-end
          echo "VITE_API_BASE_URL=https://clubmanagment.com" > .env

      - name: Build Front
        run: |
          cd front-end
          npm run build

      # Déploiement EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/***/ClubManager

            echo "🔧 Ajustement des droits sur le dossier ClubManager..."
            sudo chown -R $USER:$USER /home/***/ClubManager
            sudo chmod -R u+rwX /home/***/ClubManager

            # Nettoyage Git local avant pull pour éviter conflits
            git reset --hard HEAD
            git clean -fd
            git pull origin hosting

            # Build types partagés (si script build présent)
            cd packages/types
            npm install
            if npm run | grep -q build; then npm run build; else echo "No build script in packages/types"; fi

            # Build API
            cd ../../api
            npm install
            npm run build

            # Build front
            cd ../front-end
            npm install
            echo "VITE_API_BASE_URL=https://clubmanagment.com" > .env
            npm run build

            # Préparer dossier nginx
            sudo mkdir -p /var/www/html
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            echo "🔧 Ajustement des droits pour nginx sur /var/www/html..."
            sudo chown -R nginx:nginx /var/www/html

            # Redémarrage du service à la toute fin
            sudo systemctl restart clubmanager.service
