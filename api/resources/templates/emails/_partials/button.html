<!-- Bouton CTA réutilisable pour tous les emails -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 25px 0;">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td align="center" style="border-radius: 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);">
                        <a href="{{buttonUrl}}" style="display: inline-block; padding: 15px 40px; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; color: #ffffff; text-decoration: none; border-radius: 25px;">
                            {{buttonText}}
                        </a>
                    </td>
                </tr>
            </table>

            <!-- Fallback lien si le bouton ne fonctionne pas -->
            <p style="margin: 15px 0 0 0; font-size: 12px; color: #666;">
                Si le bouton ne fonctionne pas, copiez ce lien :<br>
                <span style="word-break: break-all; color: #667eea;">{{buttonUrl}}</span>
            </p>
        </td>
    </tr>
</table>
