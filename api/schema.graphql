type Utilisateur {
  id: ID!
  first_name: String!
  last_name: String!
  nom_utilisateur: String!
  email: String!
  genre: Genre
  date_of_birth: String!
  status: Status
  grade: Grade
  abonnement: PlanTarifaire
  # relations
  inscriptions: [Inscription]
  commandes: [Commande]
}

type Professeur {
  id: ID!
  nom: String!
  prenom: String!
  email: String
  grade: Grade
  status: Status
  # relations
  cours_recurrents: [CoursRecurrent]
}

type Article {
  id: ID!
  nom: String!
  description: String
  prix: Float!
  image_url: String
  categorie: Categorie
  stocks: [Stock]
  images: [Image]
}

type Stock {
  id: ID!
  article: Article!
  taille: Taille!
  quantite: Int!
}

type Image {
  id: ID!
  article: Article!
  url: String!
  is_main: Boolean
}

type Genre {
  id: ID!
  genre_name: String!
}

type Grade {
  id: ID!
  grade_id: String!
}

type PlanTarifaire {
  id: ID!
  nom_plan: String!
  prix: Float!
  periode: String!
  description: String
}

type Taille {
  id: ID!
  nom: String!
}

type Categorie {
  id: ID!
  nom: String!
}

type CoursRecurrent {
  id: ID!
  type_cours: String!
  jour_semaine: Int!
  heure_debut: String!
  heure_fin: String!
  active: Boolean
  professeurs: [Professeur]
  cours: [Cours]
}

type Cours {
  id: ID!
  date_cours: String!
  type_cours: String!
  heure_debut: String!
  heure_fin: String!
  cours_recurrent: CoursRecurrent!
  inscriptions: [Inscription]
}

type Inscription {
  id: ID!
  utilisateur: Utilisateur!
  cours: Cours!
  date_inscription: String!
  status_id: Boolean
}

type Commande {
  id: ID!
  utilisateur: Utilisateur!
  date_commande: String!
  statut: String!
  articles: [CommandeArticle]
}

type CommandeArticle {
  id: ID!
  commande: Commande!
  article: Article!
  taille: Taille!
  quantite: Int!
  prix: Float!
}

type Query {
  utilisateurs: [Utilisateur]
  utilisateur(id: ID!): Utilisateur
  professeurs: [Professeur]
  articles: [Article]
  article(id: ID!): Article
  cours: [Cours]
  coursRecurrent: [CoursRecurrent]
  commandes: [Commande]
  inscription(id: ID!): Inscription
  # ...ajoute d'autres queries selon besoin...
}
