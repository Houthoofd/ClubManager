<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{clubName}}</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f4f4; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .content { 
            background-color: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .header h1 { 
            color: white; 
            margin: 0; 
            font-size: 28px; 
        }
        .header h2 { 
            color: #ffeb3b; 
            margin: 10px 0 0 0; 
            font-size: 22px; 
        }
        .greeting {
            margin-bottom: 20px;
            font-size: 16px;
        }
        .message-content {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #007bff;
        }
        .footer { 
            border-top: 1px solid #bdc3c7; 
            padding-top: 20px; 
            margin-top: 30px; 
            color: #7f8c8d; 
            font-size: 14px; 
            text-align: center; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="header">
                <h1>🥋 {{clubName}}</h1>
                <h2>{{title}}</h2>
            </div>
            
            <div class="greeting">
                Bonjour <strong>{{firstName}}</strong>,
            </div>
            
            <div class="message-content">
                <div style="white-space: pre-line; font-size: 16px; line-height: 1.6;">
                    {{content}}
                </div>
            </div>
            
            <div style="margin: 20px 0; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
                <p style="margin: 0; font-size: 14px; color: #6c757d;">
                    💡 <strong>Besoin d'aide ?</strong> Connectez-vous à votre espace personnel pour plus d'informations.
                </p>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="{{frontendUrl}}" style="background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">
                        🔗 Mon espace personnel
                    </a>
                </div>
            </div>
            
            <p style="margin-top: 30px;">
                Cordialement,<br>
                <strong>L'équipe {{clubName}}</strong>
            </p>
        </div>
        
        <div class="footer">
            <p>© {{currentYear}} {{clubName}} - Tous droits réservés</p>
            <p>Support : <a href="mailto:{{supportEmail}}">{{supportEmail}}</a></p>
        </div>
    </div>
</body>
</html>
