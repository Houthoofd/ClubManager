# Configuration minimale pour débugger
server {
    listen 80;
    server_name clubmanagment.com localhost _;
    
    # Route de test simple
    location /test {
        return 200 "Nginx fonctionne!\n";
        add_header Content-Type text/plain;
    }
    
    # Route par défaut
    location / {
        return 200 "Default OK - Redirect to HTTPS\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl http2;
    server_name clubmanagment.com;
    
    # SSL basique
    ssl_certificate /etc/letsencrypt/live/clubmanagment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubmanagment.com/privkey.pem;
    
    root /usr/share/nginx/html/clubmanager;
    index index.html;
    
    # API
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Assets
    location /assets/ {
        try_files $uri =404;
    }
    
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
